<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor IA · Safeweb</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar"><div><strong>Monitor IA</strong><span>Agentes de IA no Orpen</span></div><button id="refresh">Atualizar dados</button></header>
<main>
<section class="controls"><label>Período <select id="preset"><option value="today">Hoje</option><option value="yesterday">Ontem</option><option value="7days">Últimos 7 dias</option><option value="custom">Personalizado</option></select></label><input id="start" type="date"><input id="end" type="date"><span id="status">Aguardando coleta</span></section>
<section id="kpis" class="grid"></section>
<section class="panel"><h2>Desfechos da IA</h2><div id="outcomes"></div></section>
<section class="panel"><h2>Desempenho por IA</h2><div id="agents"></div></section>
<section class="panel"><h2>Pesquisas</h2><div id="surveys"></div></section>
<section class="panel"><h2>Problemas não resolvidos</h2><div id="protocols"></div></section>
<section class="panel"><h2>Qualidade</h2><div id="quality"></div></section>
</main><script src="/app.js"></script>
</body></html>
